apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana
  namespace: flux-system
spec:
  interval: 30m
  path: ./manifests/infrastructure/grafana
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: victoria-metrics
    - name: envoy
  decryption:
    provider: sops
    secretRef:
      name: sops-age
