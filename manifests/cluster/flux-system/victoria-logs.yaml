apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: victoria-logs
  namespace: flux-system
spec:
  interval: 30m
  path: ./manifests/infrastructure/victoria-logs
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    # owns the monitoring namespace and the victoria-metrics HelmRepository
    - name: victoria-metrics
