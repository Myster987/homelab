apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-exporter
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: prometheus-node-exporter
      version: 4.57.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  values:
    # Talos has no accessible host root fs
    hostRootFsMount:
      enabled: false
    service:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
    resources:
      requests:
        cpu: 10m
        memory: 24Mi
      limits:
        memory: 64Mi
