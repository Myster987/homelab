apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-state-metrics
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-state-metrics
      version: 8.5.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  values:
    service:
      annotations:
        prometheus.io/port: "8080"
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        memory: 128Mi
