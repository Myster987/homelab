apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vmsingle
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: victoria-metrics-single
      version: 0.46.0
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
  values:
    server:
      retentionPeriod: 1y
      persistentVolume:
        enabled: true
        size: 10Gi
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 512Mi
      # VM single scrapes targets itself — no vmagent needed
      scrape:
        enabled: true
        config:
          global:
            scrape_interval: 30s
          scrape_configs:
            - job_name: deye
              static_configs:
                - targets:
                    - deye-exporter.monitoring.svc.cluster.local:9100
