apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluent-bit
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: fluent-bit
      version: 0.58.2
      sourceRef:
        kind: HelmRepository
        name: fluent
  values:
    # chart default inputs (tail /var/log/containers) and kubernetes
    # filter are kept; only the output is replaced (default is elasticsearch)
    config:
      outputs: |
        [OUTPUT]
            name http
            match kube.*
            host vlogs-victoria-logs-single-server.monitoring.svc.cluster.local
            port 9428
            compress gzip
            uri /insert/jsonline?_stream_fields=stream,kubernetes.namespace_name,kubernetes.pod_name,kubernetes.container_name&_msg_field=log&_time_field=date
            format json_lines
            json_date_format iso8601
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
