apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authelia
  namespace: networking
spec:
  interval: 15m
  chart:
    spec:
      chart: authelia
      version: 0.11.6
      sourceRef:
        kind: HelmRepository
        name: authelia
        namespace: networking
      interval: 2h
  values:
    pod:
      kind: Deployment
    configMap:
      theme: dark
      authentication_backend:
        file:
          enabled: true
          path: /secrets/authelia-users/users_database.yml
          watch: true
      access_control:
        default_policy: deny
        # Protected apps list: one rule per app hostname.
        rules:
          - domain: hubble.mikolajmaciejak.dev
            policy: two_factor
      session:
        cookies:
          # Cookie valid for all *.mikolajmaciejak.dev apps; portal at
          # https://auth.mikolajmaciejak.dev
          - domain: mikolajmaciejak.dev
            subdomain: auth
            default_redirection_url: https://hubble.mikolajmaciejak.dev
      storage:
        local:
          enabled: true
      notifier:
        # Single-user setup: "emails" (TOTP enrollment, password reset) are
        # written to /config/notification.txt instead of SMTP. Read them with:
        #   kubectl exec -n networking deploy/authelia -- tail -40 /config/notification.txt
        # Switching to smtp also requires adding the key
        # 'notifier.smtp.password.txt' to authelia-secret, otherwise the pod
        # hangs in ContainerCreating on a failed volume mount.
        filesystem:
          enabled: true
    secret:
      # Must contain keys: session.encryption.key, storage.encryption.key,
      # identity_validation.reset_password.jwt.hmac.key
      existingSecret: authelia-secret
      additionalSecrets:
        # Secret 'authelia-users' mounted at /secrets/authelia-users/
        authelia-users: {}
    persistence:
      enabled: true
      size: 100Mi
