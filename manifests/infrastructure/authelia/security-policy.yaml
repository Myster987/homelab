# Attaches Authelia ext-auth to routes. Add a targetRef per HTTPRoute that
# should require login, and a matching access_control rule in release.yaml.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: authelia-ext-auth
  namespace: networking
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: hubble-ui-route
  extAuth:
    headersToExtAuth:
      - accept
      - cookie
      - authorization
      - proxy-authorization
      - x-forwarded-proto
    http:
      backendRefs:
        - name: authelia
          port: 80
      path: /api/authz/ext-authz/
      headersToBackend:
        - remote-user
        - remote-groups
        - remote-email
        - remote-name
