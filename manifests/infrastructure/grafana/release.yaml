apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: grafana
      version: 10.5.15
      sourceRef:
        kind: HelmRepository
        name: grafana
  values:
    initChownData:
      # CSI fsGroup handles volume ownership; the chown init container backoff-loops
      enabled: false
    securityContext:
      fsGroup: 472
      runAsUser: 472
      runAsGroup: 472
    admin:
      existingSecret: grafana-admin
    grafana.ini:
      server:
        root_url: https://grafana.mikolajmaciejak.dev
      feature_toggles:
        # dashboard.grafana.app apiserver times out on single-instance SQLite
        kubernetesDashboards: false
        kubernetesClientDashboardsFolders: false
    persistence:
      enabled: true
      size: 2Gi
    plugins:
      - victoriametrics-logs-datasource
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: VictoriaMetrics
            type: prometheus
            access: proxy
            url: http://vmsingle-victoria-metrics-single-server.monitoring.svc.cluster.local:8428
            isDefault: true
          - name: VictoriaLogs
            type: victoriametrics-logs-datasource
            access: proxy
            url: http://vlogs-victoria-logs-single-server.monitoring.svc.cluster.local:9428
