# Protected routes list: add a targetRef per HTTPRoute that should require login.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: oauth2-proxy-ext-auth
  namespace: networking
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: hubble-ui-route
  extAuth:
    headersToExtAuth:
      - cookie
      - authorization
    http:
      backendRefs:
        - name: oauth2-proxy
          port: 80
