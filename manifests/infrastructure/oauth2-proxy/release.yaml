apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: oauth2-proxy
  namespace: networking
spec:
  interval: 15m
  chart:
    spec:
      chart: oauth2-proxy
      version: 10.7.0
      sourceRef:
        kind: HelmRepository
        name: oauth2-proxy
        namespace: networking
      interval: 2h
  values:
    config:
      # Secret must provide keys: client-id, client-secret, cookie-secret
      existingSecret: oauth2-proxy-secret
    extraArgs:
      provider: github
      github-user: Myster987
      email-domain: "*"
      # GitHub OAuth apps allow exactly one callback URL, so all logins
      # bounce through the auth host; the rd param returns users to the
      # app they originally requested (must match whitelist-domain).
      redirect-url: https://auth.mikolajmaciejak.dev/oauth2/callback
      # ext-auth mode: no real upstream, 202 = request allowed
      upstream: static://202
      reverse-proxy: "true"
      cookie-domain: .mikolajmaciejak.dev
      whitelist-domain: .mikolajmaciejak.dev
      cookie-secure: "true"
      skip-provider-button: "false"
