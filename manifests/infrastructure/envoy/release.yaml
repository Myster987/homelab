apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: envoy-gateway-system
spec:
  interval: 15m
  chart:
    spec:
      chart: gateway-helm
      version: 1.8.3
      sourceRef:
        kind: HelmRepository
        name: envoy-gateway
        namespace: envoy-gateway-system
      interval: 2h
  values:
    crds:
      # Gateway API CRDs come from manifests/infrastructure/crds (standard
      # channel); Envoy Gateway CRDs from crds/envoy-crds.yaml — the chart
      # bundle conflicts with standard-channel CRDs and helm cannot store
      # them in a release secret (>1MB).
      enabled: false
