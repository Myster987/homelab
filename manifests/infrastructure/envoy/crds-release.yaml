apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway-crds
  namespace: envoy-gateway-system
spec:
  interval: 15m
  chart:
    spec:
      chart: gateway-crds-helm
      version: 1.8.3
      sourceRef:
        kind: HelmRepository
        name: envoy-gateway
        namespace: envoy-gateway-system
      interval: 2h
  values:
    crds:
      gatewayAPI:
        enabled: false
      envoyGateway:
        enabled: true
