apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui-route
  namespace: networking
spec:
  parentRefs:
    - name: edge
      namespace: networking
  hostnames:
    - "hubble.mikolajmaciejak.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        # hubble-ui's nginx sends no Cache-Control, so browsers heuristically
        # cache index.html for weeks. A stale shell renders with an expired
        # Authelia session and its assets get the ext-auth denial instead of
        # CSS. no-cache forces revalidation, so the navigation hits ext-auth
        # and redirects to the portal.
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Cache-Control
                value: "no-cache"
      backendRefs:
        - name: hubble-ui
          namespace: kube-system
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-networking-to-hubble
  namespace: kube-system
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: networking
  to:
    - group: ""
      kind: Service
      name: hubble-ui
