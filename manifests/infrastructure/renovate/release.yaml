apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate
  namespace: renovate
spec:
  interval: 5m
  chart:
    spec:
      chart: renovate
      version: ">=46.0.0 <47.0.0"
      sourceRef:
        kind: HelmRepository
        name: renovate
        namespace: renovate
      interval: 1m
  values:
    renovate:
      config: |-
        {
          "extends": ["config:recommended"],
          "labels": ["renovate", "dependencies"],
          "platform": "github",
          "repositories": ["Myster987/homelab"],
          "kubernetes": {
            "managerFilePatterns": ["/^manifests/.+\\.yaml$/"]
          },
          "flux": {
            "managerFilePatterns": ["/^manifests/.+\\.yaml$/"]
          }
        }
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop:
            - ALL
    envFrom:
      - secretRef:
          name: renovate-secret
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
